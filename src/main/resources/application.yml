spring:
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            certificate: ${ES_CA_CERT:file:/opt/elastic/elasticsearch-9.5.5/config/certs/http_ca.crt}
  elasticsearch:
    uris: ${ES_URIS:https://localhost:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:}
    restclient:
      ssl:
        bundle: elasticsearch
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rag_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: ${REDIS_TIMEOUT:3s}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  application:
    name: rag-lab
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

rag:
  elasticsearch:
    initialize-index: ${ES_INITIALIZE_INDEX:true}
  indexing:
    lock-ttl: ${INDEXING_LOCK_TTL:5m}
  auth:
    captcha-ttl: ${CAPTCHA_TTL:2m}
    session-ttl: ${AUTH_SESSION_TTL:8h}
  web:
    connect-timeout: ${WEB_CONNECT_TIMEOUT:5s}
    request-timeout: ${WEB_REQUEST_TIMEOUT:15s}
    max-response-bytes: ${WEB_MAX_RESPONSE_BYTES:2097152}

